services:
  app:
    build: .
    environment:
      FINSIGHT_VLLM_BASE_URL: ${FINSIGHT_VLLM_BASE_URL:-http://vllm:8000/v1}
      FINSIGHT_VLLM_MODEL: ${FINSIGHT_VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      FINSIGHT_VLLM_API_KEY: ${FINSIGHT_VLLM_API_KEY:-EMPTY}
      FINSIGHT_DATA_DIR: /app/data/raw/finqa
      FINSIGHT_SPLIT: ${FINSIGHT_SPLIT:-test}
      FINSIGHT_DEVICE: ${FINSIGHT_DEVICE:-cpu}
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw/finqa:/app/data/raw/finqa:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    command:
      - --model
      - ${FINSIGHT_VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-prefix-caching
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
