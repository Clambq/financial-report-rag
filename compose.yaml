services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/raw/finqa:/app/data/raw/finqa:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    command:
      - --model
      - ${FINSIGHT_VLLM_MODEL:-Qwen/Qwen3-4B-Instruct-2507}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --enable-prefix-caching
    ports:
      - "8001:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 10
